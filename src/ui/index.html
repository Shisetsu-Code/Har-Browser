<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAR Browser</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header id="chrome">
    <div class="tabs-row">
      <div id="tabs" class="tabs"></div>
      <button id="newTab" class="tab-action" title="New tab (Ctrl+T)">+</button>
      <button id="record" class="capture-button" title="Start HAR capture">REC</button>
      <button id="stopSave" class="save-button" disabled title="Stop capture and save HAR">STOP+SAVE HAR</button>
    </div>

    <div class="toolbar">
      <button id="back" class="nav-button" title="Back">←</button>
      <button id="forward" class="nav-button" title="Forward">→</button>
      <button id="reload" class="nav-button" title="Reload">↻</button>
      <input id="address" class="address" autocomplete="off" spellcheck="false" placeholder="Game URL">
      <button id="go" class="go-button" title="Open URL">↵</button>
      <select id="speed" title="Runtime speed">
        <option value="1">1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="8">8×</option>
      </select>
      <span id="status">Ready</span>
      <span id="stats"></span>
    </div>
  </header>

  <script src="./renderer.js"></script>
</body>
</html>
